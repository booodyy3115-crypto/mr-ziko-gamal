<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Ziko Gamal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
min-height:100vh;background:#000;
background-image:url('IMG-20261125-WA4939.jpg');
background-size:cover;background-position:center;
display:flex;justify-content:center;align-items:center;padding:20px 14px;
color:#fff;overflow:hidden;
}
.card{
width:100%;max-width:280px;
background:rgba(20,12,4,0.78);
border:1px solid rgba(245,197,24,0.35);
border-radius:22px;
padding:16px 12px 12px;
text-align:center;
backdrop-filter:blur(6px);
}
.avatar{width:70px;height:70px;border-radius:50%;object-fit:cover;border:3px solid #e8d48a}
h1{font-size:24px;color:#f5e6a8;line-height:1.1;margin-bottom:14px;margin-top:10px}
a{
display:flex;align-items:center;gap:10px;text-decoration:none;
background:rgba(255,255,255,0.08);
border:1px solid #c9a227;
padding:9px 10px;border-radius:18px;margin-bottom:8px;
color:#fff;text-align:left;position:relative;z-index:2;
transition:all 0.6s ease;
}
a b{font-size:13px;display:block}
.icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;color:#fff}
.wa .icon{background:#25D366}
.fb .icon{background:#1877F2}
.ig .icon{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.tk .icon{background:#000;border:1px solid #444}
.ph .icon{background:#25D366}

/* --- التأثير: باقي الزراير بس بتتشفط --- */
a.sucked{animation:suckAway 0.7s ease-in forwards}
@keyframes suckAway{
  0%{transform:scale(1);opacity:1;filter:blur(0)}
  40%{transform:scale(0.7) rotate(8deg) translateY(10px);opacity:0.7}
  100%{transform:scale(0) rotate(40deg) translateY(30px);opacity:0;filter:blur(8px)}
}
/* الزرار اللي اخترته هو اللي بيشفطك */
a.chosen{animation:chosenSuck 0.9s ease-in forwards;z-index:10;border-color:#f5c518;box-shadow:0 0 30px rgba(245,197,24,0.8)}
@keyframes chosenSuck{
  0%{transform:scale(1)}
  30%{transform:scale(1.15)}
  60%{transform:scale(1.4)}
  100%{transform:scale(3.5);opacity:0.9;filter:blur(1px)}
}
/* الشاشة كلها بتدخل جوه الزرار */
body.zoom-in{animation:zoomIn 0.9s ease-in forwards}
@keyframes zoomIn{
  0%{transform:scale(1)}
  100%{transform:scale(2.5);filter:blur(3px)}
}
/* دوامة الشفط */
.vortex{position:fixed;top:50%;left:50%;width:0;height:0;border-radius:50%;pointer-events:none;z-index:999;opacity:0;transform:translate(-50%,-50%)}
.vortex.active{animation:vortexAnim 0.9s ease-out forwards}
@keyframes vortexAnim{
  0%{width:0;height:0;opacity:0;box-shadow:0 0 0 0 rgba(245,197,24,0)}
  50%{width:300px;height:300px;opacity:1;box-shadow:0 0 100px 60px rgba(245,197,24,0.9)}
  100%{width:600px;height:600px;opacity:0;box-shadow:0 0 0 0 rgba(245,197,24,0)}
}

@media (min-width:768px){
.card{max-width:640px;padding:44px 38px 30px;border-radius:34px}
.avatar{width:170px;height:170px;border-width:5px}
h1{font-size:54px;margin-bottom:32px;margin-top:16px}
a{padding:22px 26px;border-radius:28px;margin-bottom:18px;gap:20px}
a b{font-size:26px}
.icon{width:70px;height:70px;font-size:34px}
}
</style>
</head>
<body>
<div class="vortex" id="vortex"></div>

<div class="card" id="mainCard">
<img id="profilePic" class="avatar" src="IMG-20261125-WA0007.jpg" alt="Mr Ziko">
<h1 id="mainTitle">Mr. Ziko Gamal</h1>

<a class="wa link-btn" href="https://wa.me/201028338635"><div class="icon"><i class="fa-brands fa-whatsapp"></i></div><div><b>WhatsApp 1</b></div></a>
<a class="wa link-btn" href="https://wa.me/201284243774"><div class="icon"><i class="fa-brands fa-whatsapp"></i></div><div><b>WhatsApp 2</b></div></a>
<a class="fb link-btn" href="https://www.facebook.com/ziko.gamal.315"><div class="icon"><i class="fa-brands fa-facebook-f"></i></div><div><b>Facebook</b></div></a>
<a class="ig link-btn" href="https://www.instagram.com/ziko_gamal_10"><div class="icon"><i class="fa-brands fa-instagram"></i></div><div><b>Instagram</b></div></a>
<a class="tk link-btn" href="https://www.tiktok.com/@ziko_gamal_10"><div class="icon"><i class="fa-brands fa-tiktok"></i></div><div><b>TikTok</b></div></a>
<a class="ph link-btn" href="tel:+201028338635"><div class="icon"><i class="fa-solid fa-phone"></i></div><div><b>Call</b></div></a>
</div>

<script>
const pics = [
"IMG-20261125-WA0007.jpg",
"IMG-20261125-WA0005.jpg",
"IMG-20261125-WA0006.jpg",
"IMG-20261125-WA0004.jpg",
"IMG-20261125-WA0003.jpg",
"IMG-20261125-WA0008.jpg"
];
const randomPic = pics[Math.floor(Math.random() * pics.length)];
document.getElementById("profilePic").src = randomPic;

// التأثير: دوس على اي زرار
document.querySelectorAll('.link-btn').forEach(btn => {
  btn.addEventListener('click', function(e){
    e.preventDefault();
    const targetUrl = this.href;

    // 1. باقي الزراير بس تتشفط وتختفي - صورتك واسمك ثابتين
    document.querySelectorAll('.link-btn').forEach((other, index) => {
      if(other !== btn){
        other.style.animationDelay = (index * 0.05) + 's';
        other.classList.add('sucked');
      }
    });

    // 2. الزرار اللي اخترته يكبر ويشفطك جواه
    btn.classList.add('chosen');

    // 3. دوامة + زوم للشاشة كأنك بتدخل جواه
    const vortex = document.getElementById('vortex');
    const rect = btn.getBoundingClientRect();
    vortex.style.top = (rect.top + rect.height/2) + 'px';
    vortex.style.left = (rect.left + rect.width/2) + 'px';
    vortex.classList.add('active');
    document.body.classList.add('zoom-in');

    // 4. بعد التأثير، روح للينك
    setTimeout(()=>{ window.location.href = targetUrl; }, 950);
  });
});
</script>

</body>
</html>
