<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player;
let isReady = false;
function onYouTubeIframeAPIReady(){
  player = new YT.Player('player', {
    height: '0', width: '0',
    videoId: 'iHrthglb1u8',
    playerVars: { autoplay: 0, controls: 0, loop: 1, playlist: 'iHrthglb1u8' },
    events: { onReady: function(){ isReady = true; } }
  });
}
function playWar(){
  if(!isReady){ document.getElementById('soundStatus').innerText = '⏳ بيحمّل... دوس تاني بعد ثانيتين'; return; }
  player.playVideo();
  document.getElementById('soundStatus').innerText = '🔊 شغال دلوقتي 🥁';
}
function stopWar(){
  if(player) player.pauseVideo();
  document.getElementById('soundStatus').innerText = '⏹ وقف الصوت';
}
