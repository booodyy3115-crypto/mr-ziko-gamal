<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Ziko Gamal</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
  body{
    background:#0f0f0f;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:20px;
    background-image: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1461360228754-6e81c478b882?w=800');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
  }
  .card{
    width:100%;
    max-width:420px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:30px;
    padding:30px 22px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
  }
  .avatar{
    width:130px;height:130px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #f5c518;
    margin-bottom:15px;
  }
  h1{font-size:30px;margin-bottom:25px}
  h1 span{color:#f5c518}
  .link{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    background:white;
    color:#111;
    text-decoration:none;
    padding:12px 18px;
    border-radius:16px;
    margin-bottom:12px;
    font-weight:bold;
    font-size:17px;
    transition:0.2s;
  }
  .link:hover{transform:scale(1.03)}
  .logo{
    width:38px;height:38px;
    object-fit:contain;
    border-radius:8px;
    background:white;
    padding:2px;
  }
  .whatsapp{background:#25D366;color:white}
  .facebook{background:#1877F2;color:white}
  .instagram{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:white}
  .tiktok{background:#000;color:white;border:1px solid #333}
  .phone{background:#f5c518;color:#111}
</style>
</head>
<body>

<div class="card">
  <img class="avatar" src="https://via.placeholder.com/300" alt="Mr. Ziko Gamal">

  <h1>Mr. <span>Ziko Gamal</span></h1>

  <a class="link whatsapp" href="https://wa.me/201028338635" target="_blank">
    <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/WhatsApp.svg/512px-WhatsApp.svg.png" alt="WhatsApp">
    <span>WhatsApp</span>
  </a>

  <a class="link facebook" href="https://www.facebook.com/ziko.gamal.315" target="_blank">
    <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Facebook_Logo_%282019%29.png/512px-Facebook_Logo_%282019%29.png" alt="Facebook">
    <span>Facebook</span>
  </a>

  <a class="link instagram" href="https://www.instagram.com/ziko_gamal_10" target="_blank">
    <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Instagram_icon.png/512px-Instagram_icon.png" alt="Instagram">
    <span>Instagram</span>
  </a>

  <a class="link tiktok" href="https://www.tiktok.com/@ziko_gamal_10" target="_blank">
    <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/Tiktok_logo.png/512px-Tiktok_logo.png" alt="TikTok">
    <span>TikTok</span>
  </a>

  <a class="link phone" href="tel:+201028338635">
    <img class="logo" src="https://cdn-icons-png.flaticon.com/512/597/597177.png" alt="Phone">
    <span>Phone</span>
  </a>

</div>

</body>
</html>
