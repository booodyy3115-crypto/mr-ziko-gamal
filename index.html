<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
min-height:100vh;background:#000;
background-image:url('IMG-20261125-WA4939.jpg');
background-size:cover;background-position:center;
display:flex;justify-content:center;align-items:center;padding:20px 14px;
color:#fff;
}
/* Phone - Smaller */
.card{
width:100%;max-width:280px;
background:rgba(20,12,4,0.78);
border:1px solid rgba(245,197,24,0.35);
border-radius:22px;
padding:16px 12px 12px;
text-align:center;
backdrop-filter:blur(6px);
}
.avatar{width:70px;height:70px;border-radius:50%;object-fit:cover;border:3px solid #e8d48a}
h1{font-size:24px;color:#f5e6a8;line-height:1.1;margin-bottom:14px;margin-top:10px}
a{
display:flex;align-items:center;gap:10px;text-decoration:none;
background:rgba(255,255,255,0.08);
border:1px solid #c9a227;
padding:9px 10px;border-radius:18px;margin-bottom:8px;
color:#fff;text-align:left;
}
a b{font-size:13px;display:block}
.icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;color:#fff}
.wa .icon{background:#25D366}
.fb .icon{background:#1877F2}
.ig .icon{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.tk .icon{background:#000;border:1px solid #444}
.ph .icon{background:#25D366}

/* --- تأثير الشفط القوي --- */
.suck-btn{background:#f5c518;color:#000;border:none;font-weight:900;padding:11px 14px;border-radius:50px;cursor:pointer;margin-bottom:12px;width:100%;font-size:14px}
.suck-btn:active{transform:scale(0.97)}
.sucking{animation:suck 1s ease-in forwards !important}
@keyframes suck{
  0%{transform:scale(1) rotate(0deg);opacity:1;filter:blur(0)}
  30%{transform:scale(0.85) rotate(-5deg)}
  60%{transform:scale(0.45) rotate(15deg);filter:blur(3px)}
  85%{transform:scale(0.08) rotate(90deg);filter:blur(8px);opacity:0.6}
  100%{transform:scale(0) rotate(180deg) translateY(-100px);opacity:0;filter:blur(15px)}
}
.vortex{position:fixed;top:50%;left:50%;width:0;height:0;border-radius:50%;box-shadow:0 0 100px 50px rgba(245,197,24,0.8);transform:translate(-50%,-50%);pointer-events:none;z-index:999;opacity:0}
.vortex.active{animation:vortexAnim 1s ease-out forwards}
@keyframes vortexAnim{
  0%{width:0;height:0;opacity:0}
  50%{width:220px;height:220px;opacity:1}
  100%{width:0;height:0;opacity:0}
}

/* Desktop - Bigger */
@media (min-width:768px){
.card{max-width:640px;padding:44px 38px 30px;border-radius:34px}
.avatar{width:170px;height:170px;border-width:5px}
h1{font-size:54px;margin-bottom:32px;margin-top:16px}
a{padding:22px 26px;border-radius:28px;margin-bottom:18px;gap:20px}
a b{font-size:26px}
.icon{width:70px;height:70px;font-size:34px}
.suck-btn{font-size:19px;padding:15px}
}
</style>
</head>
<body>
<div class="vortex" id="vortex"></div>

<div class="card" id="mainCard">
<img id="profilePic" class="avatar" src="IMG-20261125-WA0007.jpg" alt="Mr Ziko">
<h1>Mr. Ziko Gamal</h1>

<button class="suck-btn" onclick="doSuck()">🌀 تأثير شفط قوي - دوس هنا</button>

<a class="wa" href="https://wa.me/201028338635"><div class="icon"><i class="fa-brands fa-whatsapp"></i></div><div><b>WhatsApp 1</b></div></a>

<a class="fb" href="https://www.facebook.com/ziko.gamal.315"><div class="icon"><i class="fa-brands fa-facebook-f"></i></div><div><b>Facebook</b></div></a>
<a class="ig" href="https://www.instagram.com/ziko_gamal_10"><div class="icon"><i class="fa-brands fa-instagram"></i></div><div><b>Instagram</b></div></a>
<a class="tk" href="https://www.tiktok.com/@ziko_gamal_10"><div class="icon"><i class="fa-brands fa-tiktok"></i></div><div><b>TikTok</b></div></a>
<a class="ph" href="tel:+201028338635"><div class="icon"><i class="fa-solid fa-phone"></i></div><div><b>Call</b></div></a>
</div>

<script>
// الـ 6 صور اللي انت رفعتهم
const pics = [
"IMG-20261125-WA0007.jpg",
"IMG-20261125-WA0005.jpg",
"IMG-20261125-WA0006.jpg",
"IMG-20261125-WA0004.jpg",
"IMG-20261125-WA0003.jpg",
"IMG-20261125-WA0008.jpg"
];
const randomPic = pics[Math.floor(Math.random() * pics.length)];
document.getElementById("profilePic").src = randomPic;

// تأثير الشفط
function doSuck(){
  const card = document.getElementById('mainCard');
  const vortex = document.getElementById('vortex');
  vortex.classList.remove('active');
  void vortex.offsetWidth;
  vortex.classList.add('active');
  card.classList.add('sucking');
  setTimeout(()=>{
    card.style.display='none';
    setTimeout(()=>{
      card.style.display='block';
      card.classList.remove('sucking');
    }, 1500);
  },1000);
}
</script>

</body>
</html>
