body.light .top button{background:#fff;color:#111}
.card{

.avatar{width:70px;height:70px;border-radius:50%;object-fit:cover;border:3px solid #e8d48a}

a{

padding:9px 10px;border-radius:18px;margin-bottom:8px;
color:#fff;text-align:left;
position:relative;overflow:hidden;transition:0.2s;
}
/* 6 - لمعة ذهبي + هزة */
a::after{
content:'';position:absolute;top:0;left:-150%;width:60%;height:100%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,0.55),transparent);
transform:skewX(-20deg);
}
a:hover::after{animation:shine 0.7s ease}
@keyframes shine{to{left:150%}}
a:hover{transform:scale(1.05) rotate(-0.5deg);border-color:#f5c518;box-shadow:0 0 15px rgba(245,197,24,0.6)}
a:hover .icon{animation:shake 0.4s}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(12deg)}75%{transform:rotate(-12deg)}}
a b{font-size:13px;display:block}
.icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;color:#fff}

.ig .icon{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.tk .icon{background:#000;border:1px solid #444}
.ph .icon{background:#25D366}

@media (min-width:768px){

<script>
const pics = [
"IMG-20261125-WA0007.jpg",
"IMG-20261125-WA0005.jpg",
"IMG-20261125-WA0006.jpg",
"IMG-20261125-WA0004.jpg",
"IMG-20261125-WA0003.jpg",
"IMG-20261125-WA0008.jpg"
];
document.getElementById("profilePic").src = pics[Math.floor(Math.random() * pics.length)];

// 10 - عربي / انجليزي
let isArabic = false;
function toggleLang(){
  isArabic = !isArabic;
  document.querySelectorAll('[data-en]').forEach(el=>{
    el.textContent = isArabic ? el.dataset.ar : el.dataset.en;
  });
  document.getElementById("langBtn").textContent = isArabic ? "English 🇺🇸" : "عربي 🇪🇬";
}

// 10 - ليلي / نهاري
let isLight = false;
function toggleTheme(){
  isLight = !isLight;
  document.body.classList.toggle("light", isLight);
  document.getElementById("themeBtn").textContent = isLight ? "🌙 Dark" : "☀️ Light";
}

// 9 - صوت طبول حرب
let audioCtx = null, drumTimer = null, soundOn = false;
function playDrum(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const t = audioCtx.currentTime;
  // طبلة عميقة
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.setValueAtTime(120, t);
  osc.frequency.exponentialRampToValueAtTime(40, t + 0.25);
  gain.gain.setValueAtTime(0.6, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.32);
}
function toggleSound(){
  soundOn = !soundOn;
  document.getElementById("soundBtn").textContent = soundOn ? "🔇 Sound: On" : "🥁 Sound: Off";
  if(soundOn){
    playDrum();
    drumTimer = setInterval(playDrum, 900);
  } else {
    clearInterval(drumTimer);
  }
}
</script>
